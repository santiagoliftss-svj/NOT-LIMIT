name: Servidor NO LIMIT (Cloudflare)

on:
  push:
    branches: [main, prueba-v2]
    paths: ["servidor/**", ".github/workflows/servidor.yml"]
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas (sin Cloudflare)
        run: node --experimental-sqlite --no-warnings servidor/prueba.mjs
      - name: Pruebas en el motor de Cloudflare (wrangler dev)
        working-directory: servidor
        run: |
          npm i -g wrangler@4 --silent
          python prueba_real.py

  subir:
    needs: probar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar que Cloudflare ya este conectado
        id: hay
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          G: ${{ secrets.GEMINI_KEY }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ] && [ -n "$G" ]; then echo "si=1" >> "$GITHUB_OUTPUT"; else
            echo "si=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta conectar Cloudflare: secretos CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID y GEMINI_KEY"
          fi
      - name: Subir a Cloudflare
        if: steps.hay.outputs.si == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: servidor
          wranglerVersion: "4"
          secrets: |
            GEMINI_KEY
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
